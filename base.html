<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.14.0/Sortable.min.js"></script>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }
        .sidebar {
            background: linear-gradient(180deg, #2C3E50 0%, #1A252F 100%);
        }
        .card {
            border-radius: 12px;
            transition: box-shadow 0.3s, transform 0.25s;
        }
        .card:hover {
            transform: translateY(-7px) scale(1.03);
            box-shadow: 0 14px 32px rgba(44,62,80,.13);
        }
        .circular-progress {
            position: relative; width: 180px; height: 180px; border-radius: 50%;
            background: conic-gradient(#2E86C1 var(--progress, 0), #e0e0e0 0deg);
            display: flex; align-items: center; justify-content: center; margin: auto;
            box-shadow: 0 2px 12px 0 rgba(46, 134, 193, 0.08);
            transition: background 0.8s cubic-bezier(.6,2,.6,1);
        }
        .circular-progress::before {
            content: ""; position: absolute;
            width: 140px; height: 140px; border-radius: 50%; background: white; z-index: 2;
        }
        .progress-value {
            position: relative; font-size: 2rem; font-weight: 600; color: #2E86C1; z-index: 3;
            letter-spacing: 2px;
        }
        /* Sidebar Responsive Animation */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed; right: 0; top: 0; bottom: 0;
                width: 68vw !important; max-width: 330px; min-width: 220px;
                transform: translateX(100%); transition: transform 0.35s cubic-bezier(.42,0,.58,1);
                z-index: 99;
            }
            .sidebar.active {
                transform: translateX(0);
                box-shadow: -5px 0 18px 0 rgba(30,44,71,.13);
            }
        }
        @media (min-width:768px){
            .sidebar {transform: none !important; position: static !important; width: 256px !important;}
        }
    </style>
</head>
<body class="flex h-screen overflow-hidden bg-gray-50" style="direction: rtl;">

<!-- SIDEBAR -->
<aside id="sidebar" class="sidebar flex flex-col text-white w-64 h-full shadow-md z-20">

    <div class="flex items-center justify-between p-4 border-b border-blue-900/20">
        <span class="text-2xl font-bold transition-all">Hamfraz</span>
        <button id="close-sidebar" class="md:hidden flex items-center p-2 hover:bg-white hover:bg-opacity-10 rounded-full transition-all">
            <!-- ✖️ -->
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>
    </div>
    <div class="flex flex-col flex-grow px-4 pt-5">
        <!-- USER -->
        <div class="flex flex-col items-center mb-8">
            <div class="w-20 h-20 flex items-center justify-center rounded-full bg-blue-500 shadow-lg border-4 border-white mb-3 overflow-hidden transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
            </div>
            <h2 class="text-lg font-medium text-white text-center">{% if user %}{{ user }}{% else %}مهمان{% endif %}</h2>
            <p class="text-sm text-gray-200 mt-0.5 text-center"></p>
        </div>
        <!-- NAV -->
        <nav class="flex-grow">
            <ul class="space-y-2">
                <li>
                    <a href="../dashboard" class="flex items-center p-3 rounded-lg transition-all bg-blue-600/20 text-white hover:bg-blue-600/40 hover:text-blue-50">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                        </svg>
                        داشبورد
                    </a>
                </li>
                <li>
                    <a href="../panel/explore_user" class="flex items-center p-3 rounded-lg text-gray-300 hover:bg-blue-600/20 hover:text-white transition-all">
                        <!-- آیکون قطب‌نما (اکسپلور) -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                d="M12 2a10 10 0 100 20 10 10 0 000-20zm2.29 7.71l-1.52 3.78a1 1 0 01-.55.55l-3.78 1.52a.25.25 0 00.31.31l3.78-1.52a1 1 0 01.55-.55l1.52-3.78a.25.25 0 00-.31-.31z"/>
                        </svg>
                        اکسپلور
                    </a>
                </li>


                <li><a href="#tasks" class="flex items-center p-3 rounded-lg text-gray-300 hover:bg-blue-600/20 hover:text-white transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                    </svg>تسک‌ها
                </a></li>
                <li><a href="#pomodoro" class="flex items-center p-3 rounded-lg text-gray-300 hover:bg-blue-600/20 hover:text-white transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>پومودورو
                </a></li>
                <li><a href="#energy" class="flex items-center p-3 rounded-lg text-gray-300 hover:bg-blue-600/20 hover:text-white transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                    </svg>انرژی
                </a></li>
                <li><a href="#analytics" class="flex items-center p-3 rounded-lg text-gray-300 hover:bg-blue-600/20 hover:text-white transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                    </svg>آنالیز
                </a></li>
                <li><a href="#social" class="flex items-center p-3 rounded-lg text-gray-300 hover:bg-blue-600/20 hover:text-white transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8h2a2 2 0 012 2v6a2 2 0 01-2 2h-2v4l-4-4H9a1.994 1.994 0 01-1.414-.586m0 0L11 14h4a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2v4l.586-.586z"/>
                    </svg>اجتماعی
                </a></li>
                <li><a href="../panel/profile" class="flex items-center p-3 rounded-lg text-gray-300 hover:bg-blue-600/20 hover:text-white transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>پروفایل
                </a></li>
            </ul>
        </nav>
        <div class="mt-auto border-t border-blue-900/10 pt-4">
            <a href="#settings" class="flex items-center p-3 text-gray-300 rounded-lg hover:bg-blue-600/20 hover:text-white transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066
                          c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924
                          0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724
                          1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724
                          1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724
                          1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724
                          1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608
                          2.296.07 2.572-1.065z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
                تنظیمات
            </a>
        </div>
    </div>
</aside>

<!-- MAIN -->
<div class="flex-1 flex flex-col overflow-hidden">
    <!-- Header -->
    <header  class=" shadow-sm relative z-10 flex items-center justify-between px-2 py-3 md:px-6">
        <div class="flex items-center">
            <button id="toggle-sidebar" class="md:hidden flex items-center p-2 rounded-full mr-2 text-gray-700 hover:bg-gray-200">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>
            <h1 class="text-xl font-semibold">{{ title }}</h1>
        </div>
        <div class="flex items-center space-x-3">
            <button class="p-2 rounded-full hover:bg-gray-100 transition-all">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 
                          10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3
                          3 0 11-6 0v-1m6 0H9"/>
                </svg>
            </button>
            <button class="p-2 rounded-full hover:bg-gray-100 transition-all">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 8h10M7 12h4m1 8l-4-4H5
                    a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- Content -->
    <main class="flex-1 overflow-y-auto p-2 md:p-6 bg-gray-100 transition-all">
        {% if user %}
            {% block content %}
            <!-- مثال برای نمایش یک ردیف تسک با پراگرس یا هرکدوم از ویجت‌ها -->
            {% endblock %}
        {% else %}
            <div class="bg-white shadow-md rounded-lg p-6 text-center mt-16">
                <h3 class="mb-2 text-red-500 font-bold text-xl">شما وارد حساب کاربری خود نشدید</h3>
                <a href="#" class="text-blue-800 font-semibold hover:underline">ورود / ثبت نام</a>
            </div>
        {% endif %}
    </main>
</div>

<script>
    // کنترل سایدبار موبایل
    const sidebar = document.getElementById('sidebar');
    document.getElementById('toggle-sidebar').addEventListener('click', () => sidebar.classList.add('active'));
    document.getElementById('close-sidebar').addEventListener('click', () => sidebar.classList.remove('active'));

    // درگ لیست تسک (در صورت موجود بودن در صفحه)
    if(document.getElementById('task-list')) {
        new Sortable(document.getElementById('task-list'), { animation: 170, ghostClass: 'bg-blue-50'});
    }

    // چارت انرژی
    if(document.getElementById('energyChart')) {
        const energyCtx = document.getElementById('energyChart').getContext('2d');
        new Chart(energyCtx, {
            type: 'line',
            data: {
                labels: ['9AM', '10AM', '11AM', '12PM', '1PM', '2PM', '3PM', '4PM'],
                datasets: [{
                    label: 'سطح انرژی',
                    data: [7, 8, 9, 6, 4, 5, 7, 8],
                    fill: true, backgroundColor: 'rgba(255, 167, 38, 0.1)',
                    borderColor: '#FFA726', tension: 0.3,
                    pointBackgroundColor: ctx => {
                        const value = ctx.dataset.data[ctx.dataIndex];
                        if      (value >= 8) return '#FFA726';
                        else if (value >= 5) return '#64B5F6';
                        return '#90CAF9';
                    },
                    pointRadius: 6
                }]
            },
            options: { plugins: {legend: {display: false}}, scales: {y: {beginAtZero: true, max: 10, ticks: {stepSize: 2}}}}
        });
    }

    // چارت بهره‌وری
    if(document.getElementById('productivityChart')) {
        const productivityCtx = document.getElementById('productivityChart').getContext('2d');
        new Chart(productivityCtx, {
            type: 'bar',
            data: {
                labels: ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],
                datasets: [
                    {label: 'Focus Sessions', data:[4,6,5,7,5,3,2], backgroundColor:'#2E86C1', borderRadius: 5},
                    {label: 'Tasks Completed', data:[5,8,6,9,7,4,3], backgroundColor:'#2ECC71', borderRadius:5}
                ]
            },
            options: {
                plugins: {legend:{position:'bottom'}},
                scales: {y: {beginAtZero:true, ticks: {stepSize:2}}}
            }
        });
    }

    // انیمیشن حرکت پراگرس پومودورو
    if (document.querySelector('.circular-progress')) {
        let timerRunning = false, timerInterval, timeLeft = 25 * 60;
        const updateTimerDisplay = () => {
            const minutes = Math.floor(timeLeft / 60),
                  seconds = timeLeft % 60;
            document.querySelector('.progress-value').textContent =
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            const progress = (1 - (timeLeft / (25*60))) * 100;
            document.querySelector('.circular-progress').style.setProperty('--progress', `${progress}%`);
        };
        window.startPomodoro = function(){
            if (!timerRunning){
                timerRunning = true;
                timerInterval = setInterval(() => {
                    if(timeLeft > 0){
                        timeLeft--; updateTimerDisplay();
                    }else{
                        clearInterval(timerInterval); timerRunning = false;
                        alert('زمان تمام شد! استراحت کن :)');
                    }
                }, 1000);
            }
        }
        window.pausePomodoro = function(){
            clearInterval(timerInterval); timerRunning = false;
        }
        window.resetPomodoro = function(){
            clearInterval(timerInterval); timerRunning = false;
            timeLeft = 25 * 60; updateTimerDisplay();
        }
        updateTimerDisplay();
        // مثال عملکرد دکمه‌ها:
        // <button onclick="startPomodoro()">شروع</button>
        // <button onclick="pausePomodoro()">توقف</button>
        // <button onclick="resetPomodoro()">ریست</button>
    }
</script>

</body>
</html>
